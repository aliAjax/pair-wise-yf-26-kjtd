<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数字档案长期保存</title>
<style>body{font:16px system-ui;max-width:980px;margin:32px auto;padding:0 16px}input,textarea,button,select{font:inherit;padding:8px;margin:4px}textarea{width:100%;height:110px}.panel{border:1px solid #bbb;padding:16px;border-radius:8px;margin:12px 0}pre{background:#f4f4f4;padding:12px;white-space:pre-wrap}.invalid{color:#b00020;font-weight:bold}.valid{color:#1b7a32;font-weight:bold}</style></head>
<body><h1>数字档案长期保存</h1><p>演示账号：owner、archivist、auditor、outsider。请求使用 <code>X-User-Id</code>。</p>
<section class="panel"><select id="user"><option>owner</option><option>archivist</option><option>auditor</option><option>outsider</option></select>
<button onclick="loadStatus()">查看档案状态</button>
<button onclick="loadArchiveProofs()">查看档案当前证明</button>
<button onclick="loadVersionProof()">查看版本当前证明</button>
<button onclick="loadProofHistory()">查看版本证明历史</button>
<pre id="out"></pre></section>
<p>页面用于完成初始化后的状态检查，核心流程由 JSON API 提供，详细接口见 README。</p>
<script>
const out=document.querySelector("#out"),user=document.querySelector("#user");
function ask(label,def){return prompt(label,def);}
async function get(url){
  const r=await fetch(url,{headers:{"X-User-Id":user.value}});
  const data=await r.json();
  out.textContent=JSON.stringify(data,null,2);
}
function loadStatus(){const id=ask("档案 ID","1");return get(`/api/archives/${id}/status`);}
function loadArchiveProofs(){const id=ask("档案 ID","1");return get(`/api/archives/${id}/proofs`);}
function loadVersionProof(){const id=ask("版本 ID","1");return get(`/api/versions/${id}/proof`);}
function loadProofHistory(){const id=ask("版本 ID","1");return get(`/api/versions/${id}/proofs`);}
</script></body></html>
